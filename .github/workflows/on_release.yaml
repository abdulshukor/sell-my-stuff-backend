name: Release

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  lambda_packaging:
    runs-on: ubuntu-latest
    name: Packaging Lambda and Upload to S3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Package code
        run: ./pacakge_code.sh

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5.1.0
        with:
          aws-region: us-east-1
          role-to-assume: ${{secrets.AWS_ROLE_ASSUME}}
          role-session-name: backend-deploymnet

      - name: Upload to S3
        run: |
          aws s3 cp lambda_package.zip s3://${{ secrets.S3_BUCKET_NAME }}/artifacts/lambda_package.zip
          aws s3 cp dependencies.zip s3://${{ secrets.S3_BUCKET_NAME }}/artifacts/dependencies.zip

  terraform:
    runs-on: ubuntu-latest
    # setting default working dir. Apply to all.
    defaults:
      run:
        working-directory: terraform
    steps:
      # Clone the code. Get copy of the code.
      - name: Checkout code
        uses: actions/checkout@v4

        # Install terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3.1.2
        with: # inputs
          terraform_version: 1.13.4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5.1.0
        with:
          aws-region: us-east-1
          role-to-assume: ${{secrets.AWS_ROLE_ASSUME}}
          role-session-name: Fronted-deploymnet

      - name: Terraform init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        # run: terraform apply --auto-approve
